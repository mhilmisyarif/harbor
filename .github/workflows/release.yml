name: Release

# Push a tag like v0.2.0 after moving [Unreleased] entries into a dated
# "## [0.2.0] - YYYY-MM-DD" section of CHANGELOG.md and bumping the version.
# Manual only: releases are normally made locally with `npm run release:local`
# (no Actions minutes). Run this from the Actions tab with an existing tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.0.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0 # full history for the attribution check
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Require the updater signing key
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secrets (see CLAUDE.md, Releases)."
            exit 1
          fi

      - name: Check tag, versions and changelog
        run: node scripts/release-check.mjs --tag "${{ inputs.tag }}"

      - name: No AI attribution in files or history
        run: node scripts/attribution-check.mjs

      - name: Release notes from CHANGELOG.md
        id: notes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          {
            echo "body<<__NOTES__"
            node scripts/release-check.mjs --notes "$version"
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Verify frontend and backend
        run: |
          npm run check:frontend
          npm run check:backend

      - name: Build installers and draft the GitHub release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; installed copies only accept updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: Harbor ${{ inputs.tag }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: ${{ contains(inputs.tag, '-') }}

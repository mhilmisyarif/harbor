name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `edited` re-runs the attribution check when a PR title/description changes.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:frontend
      - run: npm run check:release

  backend:
    name: Backend (fmt + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # tauri::generate_context! embeds the built frontend, so it must exist.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm run check:backend

  attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tracked files
        run: node scripts/attribution-check.mjs --files
      - name: Commit messages in this PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/attribution-check.mjs --commits "$BASE..$HEAD"
      - name: Commit messages on the branch
        if: github.event_name == 'push'
        run: node scripts/attribution-check.mjs --commits HEAD
      - name: PR title and description
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          node scripts/attribution-check.mjs --text-file "$RUNNER_TEMP/pr.txt"

  changelog:
    name: Changelog updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require a CHANGELOG.md entry
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "skip-changelog label set; not requiring an entry."
            exit 0
          fi
          if ! git diff --name-only "$BASE"...HEAD | grep -qx CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Add an entry under [Unreleased] (or label the PR skip-changelog for changes users can't see)."
            exit 1
          fi

  bundle:
    name: Installer build
    needs: [frontend, backend, attribution]
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: harbor-installers-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

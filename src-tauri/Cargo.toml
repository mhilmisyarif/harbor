[package]
name = "harbor"
version = "0.0.3"
description = "A dock and menu bar for Windows"
edition = "2021"
# slice::as_chunks
rust-version = "1.88"

[lib]
name = "harbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
# png for output; the rest decode user-chosen custom icons.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "bmp", "webp"] }
base64 = "0.23"
reqwest = { version = "0.13", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Storage_FileSystem",
  "Win32_Storage_EnhancedStorage",
  "Win32_Storage_Packaging_Appx",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_Registry",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Globalization",
  # Now Playing (Windows media session API)
  "Foundation",
  "Media_Control",
  "Storage_Streams",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
